name: El Roi Call CI

on:
  pull_request:
  push:
    branches:
      - main
      - "enhancement/**"

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Application and scheduled-call regression tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck member and scheduling backends
        run: ./node_modules/.bin/tsc --noEmit --strict --target es2023 --lib es2023,dom,dom.iterable --module esnext --moduleResolution bundler --allowImportingTsExtensions --skipLibCheck ../supabase/functions/scheduled-calls/service.ts ../supabase/functions/portal/service.ts

      - name: Install isolated database test tooling
        run: npm ci --ignore-scripts --prefix ../supabase/tests

      - name: Verify PostgreSQL scheduling behavior
        run: npm test --prefix ../supabase/tests

      - name: Build
        run: npm run build

      - name: Verify single-app routing architecture
        run: |
          test -f ../dist/index.html
          test -f ../dist/privacy/index.html
          test -f ../dist/terms/index.html

          # All product routes belong to the React SPA. Standalone HTML must not
          # shadow the React implementation in production.
          test ! -f ../dist/begin/index.html
          test ! -f ../dist/gift/index.html
          test ! -f ../dist/g/index.html
          test ! -f ../dist/about/index.html
          test ! -f ../dist/account/index.html

          grep -q 'path="/begin' src/App.tsx
          grep -q 'path="/gift' src/App.tsx
          grep -q 'path="/g/:code"' src/App.tsx
          grep -q 'path="/about' src/App.tsx
          grep -q 'path="/account' src/App.tsx
          grep -q 'path="/schedule' src/App.tsx
          grep -q 'path="/dashboard' src/App.tsx
