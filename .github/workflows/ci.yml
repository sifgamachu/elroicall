name: El Roi Call CI

on:
  pull_request:
  push:
    branches:
      - main
      - "enhancement/**"

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repository's existing lockfile predates this hardening pass and is
      # currently inconsistent with package.json. Install from package.json so
      # code validation can run; a regenerated lockfile is tracked separately.
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify application routing and remaining static surfaces
        run: |
          test -f ../dist/index.html
          test -f ../dist/account/index.html
          test -f ../dist/privacy/index.html
          test -f ../dist/terms/index.html

          # Product routes now belong to the React SPA and must not be shadowed
          # by duplicated standalone HTML files in the build output.
          test ! -f ../dist/begin/index.html
          test ! -f ../dist/gift/index.html
          test ! -f ../dist/g/index.html
          test ! -f ../dist/about/index.html

          grep -q 'path="/begin' src/App.tsx
          grep -q 'path="/gift' src/App.tsx
          grep -q 'path="/g/:code"' src/App.tsx
          grep -q 'path="/about' src/App.tsx

      - name: Detect package-lock drift
        continue-on-error: true
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            echo "::warning::package-lock.json is out of sync and must be regenerated before switching CI back to npm ci."
          fi
