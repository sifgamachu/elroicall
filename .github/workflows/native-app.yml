name: Elroi Calls native builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/native-app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/native-app.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install app dependencies
        working-directory: app
        run: npm ci --ignore-scripts
      - name: Validate and sync app
        working-directory: app
        run: npm run check && npm test && npm run native:sync
      - name: Build Android debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: elroi-calls-android-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        working-directory: app
        run: npm ci --ignore-scripts
      - name: Sync app
        working-directory: app
        run: npm run native:sync
      - name: Build for iPhone and iPad simulator
        working-directory: app/ios
        run: xcodebuild -project App/App.xcodeproj -scheme App -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build
