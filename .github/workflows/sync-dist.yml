name: Sync built dist

on:
  push:
    branches:
      - main
      - "enhancement/**"
      - "experience/**"

permissions:
  contents: write

jobs:
  sync-dist:
    if: ${{ !contains(github.event.head_commit.message, '[skip dist]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Build production assets
        working-directory: app
        run: npm run build

      - name: Commit generated dist when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "dist is already current"
            exit 0
          fi
          # [skip dist] prevents this workflow from recursively rebuilding,
          # but deliberately does NOT skip CI or Cloudflare. Cloudflare must
          # deploy the commit that actually contains the fresh production assets.
          git commit -m "chore: sync built dist [skip dist]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
